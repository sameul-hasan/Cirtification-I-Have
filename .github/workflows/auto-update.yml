name: Auto-Update Certificate Gallery

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.pdf'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.webp'
      - 'requirements.txt'
      - 'scripts/update_gallery.py'
      - '.github/workflows/auto-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gallery updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_gallery.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md index.html logs/cert_cache.json generated_thumbs/
          git diff --cached --quiet || git commit -m "Auto-update README + HTML certificate gallery"
          git push
