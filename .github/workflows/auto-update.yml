name: Auto-Update Certificate Gallery

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.pdf'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.webp'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Dependencies
        run: pip install google-genai pymupdf pillow

      - name: Run AI Gallery Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_gallery.py

      - name: Commit Changes
        run: |
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git add README.md logs/llm_output.log generated_thumbs/
                git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gallery + robust Gemini fallback" && git push)
