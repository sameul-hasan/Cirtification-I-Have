name: Auto-Update Certificate Gallery

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.pdf'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install AI Dependencies
        run: pip install groq PyPDF2
        
      - name: Run AI Gallery Update Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/update_gallery.py
        
      - name: Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update gallery with Groq AI descriptions" && git push)
